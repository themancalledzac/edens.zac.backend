# Scheduled dependency updates.
#
# Security alerts arrive on their own regardless of this file; what it adds is the
# weekly sweep that keeps ordinary version drift from piling up until the only way
# out is a large, risky bump.
#
# Maven note: GitHub's dependency graph indexes only the direct <dependency> entries
# in pom.xml, so Dependabot never sees a transitive dependency. The tomcat-embed-core
# CVEs were invisible here for exactly that reason. The OWASP Dependency Check step in
# ci-cd.yml is what covers the transitive tree; this file does not replace it.
version: 2
updates:
  - package-ecosystem: maven
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    groups:
      maven:
        patterns:
          - '*'
        update-types:
          - minor
          - patch
    commit-message:
      prefix: chore(deps)

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    groups:
      actions:
        patterns:
          - '*'
    commit-message:
      prefix: chore(ci)
