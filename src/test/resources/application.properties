# Base test properties. Shadows src/main/resources/application.properties on the test classpath,
# so anything the context needs at startup must be set here or in application-test.properties.
# Integration tests add the test profile, which supplies the Testcontainers datasource.

# Access Token Secret (for test HMAC tokens)
app.access-token.secret=test-secret-for-unit-tests

# Disable rate limiting during tests
app.contact.rate-limit-per-hour=1000000
app.contact.rate-limit-per-email-per-hour=1000000
